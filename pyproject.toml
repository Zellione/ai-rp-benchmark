[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rpbench"
version = "0.1.0"
description = "Auditable roleplay inference benchmark scaffold"
requires-python = ">=3.10"
[project.scripts]
rpbench = "rpbench.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
